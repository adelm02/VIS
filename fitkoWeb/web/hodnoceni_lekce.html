<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hodnocení lekce - FITKO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .header { background: #2d2d2d; color: white; padding: 15px 30px; border-radius: 8px 8px 0 0; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .section { padding: 30px; border-bottom: 1px solid #e0e0e0; }
        .section:last-child { border-bottom: none; }
        .section-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
        .lesson-card { background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .lesson-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .lesson-title { font-weight: 600; font-size: 16px; }
        .lesson-date { color: #666; font-size: 14px; }
        .rating-stars { display: flex; gap: 5px; margin: 10px 0; }
        .star { font-size: 24px; cursor: pointer; color: #ddd; transition: color 0.2s; }
        .star.active { color: #ffc107; }
        .star:hover { color: #ffc107; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; min-height: 80px; resize: vertical; }
        .btn { background: #000; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn:hover { background: #333; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .message { margin: 20px 0; padding: 12px; border-radius: 4px; display: none; }
        .message.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .message.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .no-reservations { text-align: center; padding: 40px; color: #999; }
        .rated { opacity: 0.6; pointer-events: none; }
        .rated-badge { background: #4caf50; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Hodnocení lekcí</h1>
    </div>

    <div class="section">
        <h2 class="section-title">Vaše dokončené lekce</h2>
        <div id="message" class="message"></div>
        <div id="loading" class="loading">Přihlašuji se...</div>
        <div id="reservationsList"></div>
    </div>
</div>

<script>
    const AUTH = {
        currentUser: null,
        API_URL: 'http://localhost:8081/api',

            async requireLogin() {
                return await this.showLoginDialog();
            },

        async showLoginDialog() {
            return new Promise((resolve, reject) => {
                const modal = document.createElement('div');
                modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10000;';
                modal.innerHTML = `
                <div style="background:white;padding:40px;border-radius:12px;max-width:400px;width:90%;">
                    <h2 style="margin:0 0 10px 0;color:#2d2d2d;">🔐 Přihlášení</h2>
                    <p style="color:#666;margin:0 0 30px 0;font-size:14px;">Pro pokračování se prosím přihlaste</p>
                    <div id="login-error" style="display:none;background:#ffebee;color:#c62828;padding:12px;border-radius:6px;margin-bottom:20px;font-size:14px;"></div>
                    <div style="margin-bottom:20px;">
                        <label style="display:block;margin-bottom:8px;font-weight:600;">Email:</label>
                        <input type="email" id="login-email" value="anna@fit.cz" style="width:100%;padding:12px;border:2px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;" />
                    </div>
                    <div style="margin-bottom:30px;">
                        <label style="display:block;margin-bottom:8px;font-weight:600;">Heslo:</label>
                        <input type="password" id="login-password" value="pwd" style="width:100%;padding:12px;border:2px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;" />
                    </div>
                    <div style="display:flex;gap:12px;">
                        <button id="login-submit" style="flex:1;background:#000;color:white;border:none;padding:14px;border-radius:6px;font-weight:600;cursor:pointer;">Přihlásit se</button>
                        <button id="login-cancel" style="background:#f5f5f5;color:#666;border:none;padding:14px 24px;border-radius:6px;font-weight:600;cursor:pointer;">Zrušit</button>
                    </div>
                    <div style="margin-top:20px;padding-top:20px;border-top:1px solid #eee;">
                        <p style="font-size:12px;color:#999;margin:0;">Heslo: <strong>pwd</strong><br>anna@fit.cz (500 Kč) | marek@fit.cz (80 Kč)</p>
                    </div>
                </div>
            `;
                document.body.appendChild(modal);

                const emailInput = modal.querySelector('#login-email');
                const passwordInput = modal.querySelector('#login-password');
                const submitBtn = modal.querySelector('#login-submit');
                const cancelBtn = modal.querySelector('#login-cancel');
                const errorDiv = modal.querySelector('#login-error');

                emailInput.focus();
                emailInput.select();

                const handleEnter = (e) => { if (e.key === 'Enter') submitBtn.click(); };
                emailInput.addEventListener('keypress', handleEnter);
                passwordInput.addEventListener('keypress', handleEnter);

                submitBtn.onclick = async () => {
                    const email = emailInput.value.trim();
                    const password = passwordInput.value.trim();

                    if (!email || !password) {
                        errorDiv.textContent = 'Vyplňte email i heslo';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Ověřuji...';
                    errorDiv.style.display = 'none';

                    try {
                        const response = await fetch(`${this.API_URL}/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });

                        const data = await response.json();

                        if (data.success && data.user) {
                            localStorage.setItem('fitko_user', JSON.stringify(data.user));
                            this.currentUser = data.user;
                            document.body.removeChild(modal);
                            resolve(data.user);
                        } else {
                            errorDiv.textContent = (data.error || 'Nesprávné přihlašovací údaje');
                            errorDiv.style.display = 'block';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Přihlásit se';
                        }
                    } catch (error) {
                        errorDiv.textContent = 'Chyba: ' + error.message;
                        errorDiv.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Přihlásit se';
                    }
                };

                cancelBtn.onclick = () => {
                    document.body.removeChild(modal);
                    reject(new Error('Přihlášení zrušeno'));
                };
            });
        }
    };

    const API_URL = 'http://localhost:8081/api';
    let CUSTOMER_ID = null;
    let reservations = [];

    async function initApp() {
        document.getElementById('loading').style.display = 'block';

        try {
            const user = await AUTH.requireLogin();
            CUSTOMER_ID = user.id;
            console.log('Přihlášen:', user.name, '(ID:', user.id, ')');

            await loadReservations();

        } catch (error) {
            console.error('Přihlášení selhalo:', error);
            document.getElementById('loading').style.display = 'none';
            showMessage('Musíte se přihlásit pro hodnocení lekcí', 'error');
            setTimeout(() => initApp(), 2000);
        }
    }

    async function loadReservations() {
        try {
            const res = await fetch(`${API_URL}/reservations?customerId=${CUSTOMER_ID}`);
            reservations = await res.json();
            console.log('Načteno rezervací:', reservations.length);
            renderReservations();
        } catch (e) {
            console.error('Chyba při načítání rezervací:', e);
            showMessage('Nepodařilo se načíst rezervace', 'error');
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderReservations() {
        const container = document.getElementById('reservationsList');

        if (reservations.length === 0) {
            container.innerHTML = '<div class="no-reservations">Nemáte žádné dokončené lekce k hodnocení</div>';
            return;
        }

        container.innerHTML = reservations.map((res, index) => {
            const isRated = res.rating !== null;
            return `
            <div class="lesson-card ${isRated ? 'rated' : ''}">
                <div class="lesson-info">
                    <div>
                        <div class="lesson-title">${res.lessonTitle}</div>
                        <div class="lesson-date">Trenér: ${res.trainer} | Datum: ${res.datum}</div>
                    </div>
                    ${isRated ? `<span class="rated-badge">Ohodnoceno: ${res.rating}★</span>` : ''}
                </div>

                ${!isRated ? `
                    <div class="rating-stars" id="stars-${index}">
                        ${[1,2,3,4,5].map(star =>
                `<span class="star" data-index="${index}" data-rating="${star}" onclick="selectRating(${index}, ${star})">★</span>`
            ).join('')}
                    </div>
                    <textarea id="review-${index}" placeholder="Napište svou recenzi... (nepovinné)"></textarea>
                    <br><br>
                    <button class="btn" onclick="submitRating(${res.id}, ${index})">Odeslat hodnocení</button>
                ` : `
                    <div style="margin-top: 10px; color: #666;">
                        ${res.review ? `<p><strong>Vaše recenze:</strong> ${res.review}</p>` : ''}
                    </div>
                `}
            </div>
        `;
        }).join('');
    }

    let selectedRatings = {};

    function selectRating(index, rating) {
        selectedRatings[index] = rating;
        const stars = document.querySelectorAll(`#stars-${index} .star`);
        stars.forEach((star, i) => {
            if (i < rating) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });
    }

    async function submitRating(reservationId, index) {
        const rating = selectedRatings[index];
        if (!rating) {
            showMessage('Prosím vyberte hodnocení (hvězdičky)', 'error');
            return;
        }

        const review = document.getElementById(`review-${index}`).value;

        try {
            const res = await fetch(`${API_URL}/reservations/rate`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    reservationId: reservationId,
                    rating: rating,
                    review: review
                })
            });

            const data = await res.json();

            if (data.success) {
                showMessage('Hodnocení bylo uloženo!', 'success');
                await loadReservations();
            } else {
                showMessage(data.error || 'Chyba při ukládání hodnocení', 'error');
            }
        } catch (e) {
            console.error('Chyba při odesílání hodnocení:', e);
            showMessage('Chyba při ukládání hodnocení', 'error');
        }
    }

    function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = `message ${type}`;
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 5000);
    }

    initApp();
</script>
</body>
</html>
